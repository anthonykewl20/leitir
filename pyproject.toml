[build-system]
requires = ["setuptools>=80", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "leitir"
version = "0.1.1"
description = "Typed foundation for the Leitir technical search prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "coverage>=7.0",
]
dev = [
    "leitir[test]",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
leitir = "leitir.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
leitir = [
    "benchmarks/**/*.json",
    "benchmarks/**/*.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
