          LEITIR_ENABLE_LIVE_E2E: '1'
          LEITIR_NSJAIL_DEBUG: '1'
          PYTHONPATH: src
        run: >-
          chmod a+rx "$RUNNER_TEMP" && sudo --preserve-env=LEITIR_ENABLE_DONOR_EXECUTION,LEITIR_ENABLE_LIVE_E2E,LEITIR_NSJAIL_DEBUG,PYTHONPATH python -m leitir.cli exit-gate-run benchmarks/exit-corpus/corpus-v1.1.json
          --corpus-root benchmarks/exit-corpus --donors-dir ${{ runner.temp }}/leitir-corpus-root
          --out runs/exit-gate
          --substrate-nsjail-sha ${{ steps.substrate.outputs.nsjail_sha }}
          --substrate-rootfs-digest ${{ steps.substrate.outputs.rootfs_digest }}
          --nsjail-version "${{ steps.substrate.outputs.nsjail_version }}"
          --nsjail-build-identity ${{ steps.substrate.outputs.nsjail_build_identity }}
          --config-schema-digest ${{ steps.substrate.outputs.config_schema_digest }}
          --rootfs-source ${{ runner.temp }}/leitir-contained-rootfs --json
      - name: Report debug seccomp denials
        if: ${{ always() }}
