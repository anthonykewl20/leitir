name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --outdir dist/
      - name: Verify package contents
        run: |
          python -m pip install --quiet twine
          python -m twine check dist/*
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Generate release notes from commits since the last tag
          previous_tag=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            notes=$(git log --pretty=format:'- %s' "${previous_tag}..${tag}")
          else
            notes=$(git log --pretty=format:'- %s' "${tag}")
          fi
          # Create release with artifacts
          gh release create "$tag" --title "$tag" --notes "$notes" dist/*.whl dist/*.tar.gz
