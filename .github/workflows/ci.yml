name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.x'
          - os: windows-latest
            python-version: '3.x'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Run offline test suite
        shell: bash
        run: PYTHONPATH=src uv run --no-project --with-requirements requirements.txt python -m pytest -q --tb=short

  determinism:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hash-seed: ['0', '1', '42']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Test deterministic behavior with PYTHONHASHSEED=${{ matrix.hash-seed }}
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
          PYTHONPATH: src
        run: >-
          uv run --no-project --with-requirements requirements.txt
          python -m pytest tests/test_treehash.py tests/test_materialize.py
          tests/test_parity.py tests/test_snapshot.py -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Build wheel and source distribution
        run: uv run --no-project --with build --with twine python -m build --outdir dist/
      - name: Check distribution metadata
        run: uv run --no-project --with twine python -m twine check dist/*
      - name: List wheel contents
        run: python -c "import zipfile, sys; print('\n'.join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))" dist/*.whl
      - name: Check required wheel contents
        run: >-
          python -c "import glob, zipfile;
          required={'leitir/benchmarks/search-v1/manifest.json','leitir/benchmarks/corpus-v1/manifest.json','leitir/benchmarks/corpus-v1/README.md','leitir/__init__.py','leitir/cli.py','leitir/treehash.py'};
          names=set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist());
          missing=sorted(required-names);
          assert not missing, f'Missing required wheel entries: {missing}'"
      - name: Smoke-test installed wheel
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --no-deps dist/*.whl
          smoke-venv/bin/python -m leitir.cli --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      # Ruff and mypy can land after the maintainer chooses the project's tools.
      - name: Byte-compile source
        run: python -m compileall -q src
      - name: Smoke-import key modules
        env:
          PYTHONPATH: src
        run: python -c "import leitir; import leitir.cli; import leitir.treehash; import leitir.materialize; import leitir.resolver; import leitir.snapshot; import leitir.corpus; import leitir.trust"

  # Configure "CI / required checks pass" as a required status check in branch
  # protection. Branch protection must be configured separately in GitHub settings.
  required-checks-pass:
    name: required checks pass
    if: always()
    needs:
      - test
      - determinism
      - package
      - lint
    runs-on: ubuntu-latest
    steps:
      # v1.2.4 does not exist upstream; v1.2.2 is the latest published tag.
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
