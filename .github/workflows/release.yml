name: Release

# Audit fix (2026-08-23): a v* tag used to rebuild artifacts with floating
# pip/build/twine and publish them unverified, with no CI gate. Publication is
# now gated end-to-end:
#   gate    - push/dispatch CI for the EXACT tagged commit must have succeeded;
#   package - the CI-tested wheel/sdist artifact is reused (never rebuilt),
#             tag<->file-name<->METADATA version is verified, and twine comes
#             from the hash-locked .github/workflows/requirements-release.lock;
#   attest  - build provenance is attested for exactly those files;
#   release - the recorded sha256 digests are re-verified before the GitHub
#             release is created from the same CI-tested bytes.

on:
  push:
    tags:
      - 'v*'

permissions: {}  # each job below grants only what it needs

jobs:
  gate:
    # Gate 1 - green CI for the exact SHA. On an annotated-tag push GITHUB_SHA
    # is the tag OBJECT, not the commit (this repo's tags are annotated, e.g.
    # v0.1.4), so peel it with ^{commit} before matching CI runs.
    # API-only job; 5 min matches the required-checks-pass budget in ci.yml.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # gh run list
    outputs:
      commit_sha: ${{ steps.resolve.outputs.commit }}
      ci_run_id: ${{ steps.ci.outputs.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Resolve the tagged commit SHA
        id: resolve
        run: |
          set -euo pipefail
          commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "${GITHUB_REF_NAME} (GITHUB_SHA=${GITHUB_SHA}) -> commit ${commit}"
      - name: Require successful push or dispatch CI for that exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit }}
        run: |
          set -euo pipefail
          # NOTE: the workflow file is ci.yml - the GitHub API resolves
          # workflow file names case-sensitively, so 'CI.yml' would 404.
          runs="$(gh run list --workflow ci.yml --commit "$COMMIT_SHA" --json databaseId,headSha,conclusion,status,event)"
          # PR run.headSha names the head, but default checkout builds its
          # merge ref. Only push/dispatch checkout is the named commit itself.
          eligible_runs="$(printf '%s' "$runs" | jq --arg c "$COMMIT_SHA" '[.[] | select(.headSha == $c and (.event == "push" or .event == "workflow_dispatch"))]')"
          run_id="$(printf '%s' "$eligible_runs" | jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | .[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            echo "Green CI run for commit ${COMMIT_SHA} (audit trail):"
            echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # No green run: fail closed with a precise reason.
          pending="$(printf '%s' "$eligible_runs" | jq '[.[] | select(.status != "completed")] | length')"
          if [ "${pending:-0}" -gt 0 ]; then
            echo "::error::Push/dispatch CI for commit ${COMMIT_SHA} is still in progress; re-run this workflow after it completes." >&2
          elif [ "$eligible_runs" != "[]" ]; then
            echo "::error::Push/dispatch CI ran for commit ${COMMIT_SHA} but no run concluded 'success'; refusing to publish." >&2
          else
            echo "::error::No release-qualified CI run found for commit ${COMMIT_SHA}; run CI with workflow_dispatch on this commit or use its successful main push. Pull-request merge-ref builds cannot qualify a release." >&2
          fi
          exit 1

  package:
    # Gate 2 - reuse the tested artifact, never rebuild: download the
    # wheel/sdist that the green CI run built and tested
    # (python-package-distributions), verify tag<->file-name<->METADATA
    # version, re-run twine check with the hash-locked twine, and republish
    # the exact bytes as this run's 'dist' artifact (attest/release
    # re-verify the recorded sha256 digests against it).
    needs: gate
    # Matches the CI package-job budget in ci.yml; install-dominated.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # gh run download
    outputs:
      dist_sha256: ${{ steps.digests.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/requirements-release.lock
      - name: Download the CI-tested distributions (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          gh run download "$CI_RUN_ID" --name python-package-distributions --dir dist
          test -d dist
          ls -l dist
      - name: Verify the padded tag and normalized distribution identities
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/verify_release.py --tag "$TAG" --dist dist
      - name: Install hash-locked twine
        run: >-
          uv pip install --system --require-hashes --only-binary :all:
          -r .github/workflows/requirements-release.lock
      - name: Twine-check the distributions
        run: python -m twine check dist/*
      - name: Record distribution digests
        id: digests
        env:
          CI_RUN_ID: ${{ needs.gate.outputs.ci_run_id }}
        run: |
          set -euo pipefail
          sha256sum dist/*
          {
            echo "### CI-tested distributions (from CI run ${CI_RUN_ID})"
            echo '```'
            sha256sum dist/*
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "sha256=$(sha256sum dist/* | sort -k 2 | tr '\n' '|')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    # Gate 3 - provenance: attest build provenance for exactly the CI-tested
    # files 'release' will publish (dist/* holds only the two verified
    # archives; 'release' independently re-verifies the same digests).
    needs: [gate, package]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # OIDC token signing the attestation
      attestations: write  # persist the attestation
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    # Gate 4 - publish the exact tested bytes: re-verify the sha256 digests
    # 'package' recorded before creating the release.
    needs: [gate, package, attest]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to create the release and upload assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Verify the files are the exact bytes 'package' verified
        env:
          EXPECTED_DIST_SHA256: ${{ needs.package.outputs.dist_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/* | sort -k 2 | tr '\n' '|')"
          if [ "$actual" != "$EXPECTED_DIST_SHA256" ]; then
            echo "::error::dist digests changed in transit; refusing to publish:" >&2
            echo "  expected: ${EXPECTED_DIST_SHA256}" >&2
            echo "  actual:   ${actual}" >&2
            exit 1
          fi
      - name: Publish GitHub Release with committed release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${TAG#v}.md"
          test -s "$notes"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes" dist/*.whl dist/*.tar.gz
