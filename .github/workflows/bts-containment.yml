      - name: Restore exit-gate artifact ownership
        if: ${{ always() }}
        run: |
          for output in runs/exit-gate "$RUNNER_TEMP/leitir-corpus-root"; do
            if [[ -e "$output" ]]; then
              sudo chown -R "$(id -u):$(id -g)" "$output"
