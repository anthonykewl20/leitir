name: BTS containment Phase 1

on:
  workflow_dispatch:
    inputs:
      run_bench:
        description: Run the optional six-task BTS benchmark driver
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nsjail-containment:
    name: Build and probe nsjail containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      # GitHub-hosted Linux runners provide passwordless sudo. It is needed for
      # apt, /usr/bin installation, namespace setup, and host cgroup-v2 writes.
      - name: Build pinned nsjail
        run: sudo tools/build-nsjail.sh
      - name: Add nsjail to PATH
        run: printf '%s\n' /usr/bin >>"$GITHUB_PATH"
      - name: Report runner containment capabilities
        run: |
          uname -a
          stat -fc 'cgroup filesystem type: %T' /sys/fs/cgroup
          printf 'available controllers: '
          tr '\n' ' ' </sys/fs/cgroup/cgroup.controllers
          printf '\nactive subtree controllers: '
          tr '\n' ' ' </sys/fs/cgroup/cgroup.subtree_control
          printf '\n'
          sysctl kernel.unprivileged_userns_clone 2>/dev/null || true
      - name: Smoke-test namespaces, seccomp, and cgroup v2
        id: smoke
        shell: bash
        run: |
          # NsJail drops to the mapped child identity before it assembles the
          # mount tree.  The generated rootfs and input sources are below this
          # runner-owned directory, so make its pathname traversable without
          # granting write access.
          chmod a+rx "$RUNNER_TEMP"
          host_uid="$(id -u)"
          host_gid="$(id -g)"
          config="$RUNNER_TEMP/nsjail-phase1.cfg"
          cat >"$config" <<EOF
          mode: ONCE
          keep_env: false
          keep_caps: false
          disable_no_new_privs: false
          mount_proc: true
          log_level: FATAL
          clone_newnet: true
          clone_newuser: true
          clone_newns: true
          clone_newpid: true
          clone_newipc: true
          clone_newuts: true
          clone_newcgroup: true
          iface_no_lo: true
          use_cgroupv2: true
          cgroupv2_mount: "/sys/fs/cgroup"
          cgroup_mem_max: 67108864
          cgroup_pids_max: 16
          cgroup_cpu_ms_per_sec: 500
          time_limit: 10
          cwd: "/tmp"
          rlimit_as: 64
          rlimit_as_type: VALUE
          rlimit_cpu: 1
          rlimit_cpu_type: VALUE
          rlimit_fsize: 1
          rlimit_fsize_type: VALUE
          rlimit_nofile: 32
          rlimit_nofile_type: VALUE
          rlimit_nproc: 16
          rlimit_nproc_type: VALUE
          rlimit_stack: 8
          rlimit_stack_type: VALUE
          rlimit_core: 0
          rlimit_core_type: VALUE
          seccomp_string: "DEFAULT KILL\nALLOW { access, arch_prctl, brk, clock_gettime, close, epoll_create1 { flags == 524288 }, execve, exit, exit_group, fcntl, futex, getcwd, getdents64, getpid, getrandom, gettid, ioctl { cmd == 21505 }, ioctl { cmd == 21585 }, lseek, mkdir, mmap, mprotect, mremap, munmap, newfstat, newfstatat, open, openat, pread64, prlimit64, read, readlink, readlinkat, rename, rseq, rt_sigaction, rt_sigprocmask, sched_getaffinity, set_robust_list, set_tid_address, statx, write }\n"
          uidmap { inside_id: "65534" outside_id: "$host_uid" count: 1 use_newidmap: false }
          gidmap { inside_id: "65534" outside_id: "$host_gid" count: 1 use_newidmap: false }
          envar: "LANG=C.UTF-8"
          envar: "PYTHONHASHSEED=0"
          envar: "TZ=UTC"
          # The root is a direct read-only bind, not chroot or tmpfs-on-/.
          # This is the mount mechanism that passes on this runner class.
          mount { src: "/" dst: "/" fstype: "bind" is_bind: true rw: false is_dir: true mandatory: true nosuid: true nodev: true }
          EOF

          # Success proves this runner can launch all six namespaces, install a
          # seccomp filter/NoNewPrivs, apply non-root ID maps, and create all
          # three required cgroup-v2 limits. Failure is the Phase-1 result.
          # Keep FATAL in the parity reference, but execute a DEBUG copy so a
          # runner-class mount failure remains diagnosable in the smoke log.
          sed 's/^log_level: FATAL$/log_level: DEBUG/' "$config" >"$RUNNER_TEMP/nsjail-phase1-debug.cfg"
          sudo nsjail --config "$RUNNER_TEMP/nsjail-phase1-debug.cfg" -- /bin/true
          # Exercise the config generated by the production renderer too, so a
          # clone or mount flag removed from _render_config cannot pass only the
          # hand-written smoke configuration above.  This is a self-contained
          # rootfs with real mount-source stubs: nsjail must prepare the same
          # validated mount, seccomp, and clone schema used by production.
          smoke_rootfs="$RUNNER_TEMP/nsjail-rendered-rootfs"
          smoke_sources="$RUNNER_TEMP/nsjail-rendered-sources"
          SMOKE_ROOTFS="$smoke_rootfs" SMOKE_SOURCES="$smoke_sources" PYTHONPATH=src python - <<'PY' >"$RUNNER_TEMP/nsjail-rendered-phase1.cfg"
          import json
          import os
          import platform
          import re
          import shutil
          import subprocess
          from pathlib import Path

          from leitir.exec_sandbox import (
              POLICY_SCHEMA,
              ContainmentPolicy,
              ReadOnlyMount,
              ROOTFS_MOUNT_TARGETS,
              _digest_payload,
              _render_config,
              _validate_policy,
              _verified_directory_tree_digest,
          )

          rootfs = Path(os.environ["SMOKE_ROOTFS"])
          sources = Path(os.environ["SMOKE_SOURCES"])
          for destination in ROOTFS_MOUNT_TARGETS:
              (rootfs / destination.lstrip("/")).mkdir(parents=True, exist_ok=True)
          scratch = sources / "scratch"
          for directory in (rootfs / "bin", sources / "donor", sources / "contract", scratch):
              directory.mkdir(parents=True, exist_ok=True)
          scratch.chmod(0o777)

          # /bin/true and its dynamic-loader closure make this a runnable
          # rootfs, while the staging directories above are the required mount
          # targets for the extra read-only production-style inputs.
          true = Path("/bin/true").resolve()
          shutil.copy2(true, rootfs / "bin" / "true")
          ldd_output = subprocess.check_output(("ldd", str(true)), text=True, stderr=subprocess.STDOUT)
          for match in re.finditer(r"(?:=>\s+|^\s*)(/[^\s(]+)", ldd_output, re.MULTILINE):
              library = Path(match.group(1))
              if library.is_file():
                  destination = rootfs / library.relative_to("/")
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(library.resolve(), destination)

          rootfs_digest = _verified_directory_tree_digest(rootfs)
          donor_digest = _verified_directory_tree_digest(sources / "donor")
          contract_digest = _verified_directory_tree_digest(sources / "contract")
          mounts = (
              ReadOnlyMount("/", str(rootfs), rootfs_digest),
              ReadOnlyMount("/staging-v1/contract", str(sources / "contract"), contract_digest),
              ReadOnlyMount("/staging-v1/donor", str(sources / "donor"), donor_digest),
          )
          mount_payload = {
              "readonly_mounts": [
                  {"destination": mount.destination, "source": mount.source, "source_digest": mount.source_digest}
                  for mount in mounts
              ],
              "rootfs_digest": rootfs_digest,
              "scratch_dir": str(scratch),
              "writable_tmpfs": "/work",
              "writable_tmpfs_bytes": 1_048_576,
              "writable_tmpfs_inodes": 128,
          }
          policy = ContainmentPolicy(
              POLICY_SCHEMA, "/usr/bin/nsjail", "sha256:" + "0" * 64, "smoke", "sha256:" + "0" * 64,
              "sha256:" + "0" * 64, platform.machine(), rootfs_digest, _digest_payload(mount_payload), mounts,
              "/work", 1_048_576, 128, str(scratch), "/work", "ONCE", False, True, True, True, True, True, True, True,
              67_108_864, 16, 500, 10, 64, 1, 1, 32, 16, 8, 0, 65_536,
              ("LANG=C.UTF-8", "PYTHONHASHSEED=0", "TZ=UTC"), True,
          )
          _validate_policy(policy)
          config = _render_config(policy)
          required = (
              "disable_no_new_privs: false",
              "clone_newnet: true",
              "clone_newuser: true",
              "clone_newns: true",
              "clone_newpid: true",
              "clone_newipc: true",
              "clone_newuts: true",
              "seccomp_string:",
          )
          if any(item not in config for item in required):
              raise RuntimeError("rendered containment smoke policy omitted a required control")
          rendered_destinations = {mount.destination for mount in policy.readonly_mounts} | {policy.writable_tmpfs}
          if not rendered_destinations <= set(ROOTFS_MOUNT_TARGETS) or "/proc" not in ROOTFS_MOUNT_TARGETS:
              raise RuntimeError("rendered containment smoke policy has a mount target absent from its immutable rootfs")
          root_mount = f'mount {{ src: {json.dumps(str(rootfs))} dst: "/" fstype: "bind" is_bind: true rw: false is_dir: true mandatory: true nosuid: true nodev: true }}'
          if root_mount not in config:
              raise RuntimeError("rendered containment smoke policy omitted its required rootfs bind")
          handwritten = Path(os.environ["RUNNER_TEMP"]) / "nsjail-phase1.cfg"
          reference = handwritten.read_text(encoding="utf-8")
          # The hand-written config is the runner-class proof.  The renderer
          # may vary only policy-pinned paths, limits, environment, and mounts;
          # all fixed containment controls must stay in lockstep.
          def non_mount_lines(text):
              policy_bound = ("mount {", "cgroup_mem_max:", "cgroup_pids_max:", "cgroup_cpu_ms_per_sec:", "time_limit:", "cwd:", "rlimit_", "envar:")
              return tuple(line.strip() for line in text.splitlines() if not line.strip().startswith((*policy_bound, "#")))
          if non_mount_lines(config) != non_mount_lines(reference):
              raise RuntimeError("generated config diverges from the passing smoke outside policy-bound mounts")
          print(config, end="")
          PY
          # The renderer intentionally uses FATAL in production.  DEBUG is
          # required here so a failed integration smoke exposes nsjail's
          # exact diagnostic without altering the production policy.
          python3 - "$RUNNER_TEMP/nsjail-rendered-phase1.cfg" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          config = path.read_text(encoding="utf-8")
          if "log_level: FATAL" not in config:
              raise SystemExit("rendered smoke config has no FATAL log level")
          path.write_text(config.replace("log_level: FATAL", "log_level: DEBUG", 1), encoding="utf-8")
          PY
          sudo nsjail --config "$RUNNER_TEMP/nsjail-rendered-phase1.cfg" -- /bin/true
      - name: Run informational live containment tests
        id: live-tests
        if: ${{ always() }}
        continue-on-error: true
        env:
          LEITIR_ENABLE_DONOR_EXECUTION: '1'
          PYTHONPATH: src
        run: >-
          uv run --no-project --with-requirements requirements.txt
          python -m pytest -q --tb=short tests/test_exec_sandbox.py -k live
      - name: Summarize experiment
        if: ${{ always() }}
        env:
          LIVE_TEST_OUTCOME: ${{ steps.live-tests.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          printf '### BTS containment Phase 1\n\n' >>"$GITHUB_STEP_SUMMARY"
          printf -- '- Namespace/seccomp/cgroup-v2 smoke-gate outcome: `%s`\n' "$SMOKE_OUTCOME" >>"$GITHUB_STEP_SUMMARY"
          printf -- '- Informational live-test outcome: `%s`\n' "$LIVE_TEST_OUTCOME" >>"$GITHUB_STEP_SUMMARY"
          printf -- '- Live failures/skips are expected until the release rootfs and corpus artifacts exist.\n' >>"$GITHUB_STEP_SUMMARY"

  corpus:
    name: Run pinned exit corpus under containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Install test requirements
        run: uv pip install --system --requirement requirements.txt
      - name: Build immutable donor-free contained rootfs
        env:
          PYTHONPATH: src
        run: |
          set -eu
          rootfs="$RUNNER_TEMP/leitir-contained-rootfs"
          rm -rf "$rootfs"
          # Populate before making the image immutable.  In particular, neither
          # cp, uv, nor NsJail may be asked to create entries below a read-only
          # rootfs.  ROOTFS_MOUNT_TARGETS is the renderer-owned deterministic
          # target list, including mount_proc and all baseline/rerun mounts.
          ROOTFS="$rootfs" PYTHONPATH=src python - <<'PY'
          import os
          from pathlib import Path

          from leitir.exec_sandbox import ROOTFS_MOUNT_TARGETS

          rootfs = Path(os.environ["ROOTFS"])
          for destination in ROOTFS_MOUNT_TARGETS:
              (rootfs / destination.lstrip("/")).mkdir(parents=True, exist_ok=True)
          PY
          install -d -m 0755 "$rootfs/usr/bin" "$rootfs/usr/lib" "$rootfs/opt/leitir/site-packages" "$rootfs/harness"
          # setup-python pins 3.12; record the exact interpreter and stdlib
          # version in the evidence log.  The runner image is the reproducible
          # input: a changed image/version necessarily changes rootfs_digest.
          python3.12 --version | tee "$RUNNER_TEMP/leitir-python-version.txt"
          cp -L "$(command -v python3.12)" "$rootfs/usr/bin/python3"
          # Copy the complete interpreter stdlib, including lib-dynload.  Do
          # not rely on the runner host's /usr/lib when the namespace is rooted
          # at this image.
          stdlib="$(python3.12 -S -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          cp -aL "$stdlib" "$rootfs/usr/lib/python3.12"
          # Preserve the complete native closure too.  The rootfs is mounted
          # at / by nsjail, so neither dynamic-loader paths nor transitive
          # extension dependencies may be inherited from the CI host.  Every
          # resolved library is placed in one deterministic directory; the
          # containment runner sets LD_LIBRARY_PATH to it before Python starts.
          # Copy symlink targets as regular files under their requested ELF
          # basenames: the canonical rootfs tree intentionally rejects
          # symlinks, while DT_NEEDED still names the requested SONAME.
          ROOTFS="$rootfs" PYTHON_BIN="$(command -v python3.12)" python3.12 - <<'PY'
          import hashlib, os, pathlib, re, shutil, subprocess, sysconfig
          root = pathlib.Path(os.environ["ROOTFS"])
          interpreter = pathlib.Path(os.environ["PYTHON_BIN"]).resolve()
          native = root / "usr/lib/leitir-native"
          native.mkdir(parents=True, exist_ok=True)
          libdir = pathlib.Path(sysconfig.get_config_var("LIBDIR"))
          ld_library = sysconfig.get_config_var("LDLIBRARY")
          libpython = libdir / ld_library if isinstance(ld_library, str) else None
          if libpython is None or not libpython.is_file():
              candidates = sorted(libdir.glob("libpython3.12.so*"))
              if not candidates:
                  raise RuntimeError("cannot locate libpython for contained rootfs")
              libpython = candidates[-1]

          def digest(path):
              hasher = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      hasher.update(chunk)
              return hasher.digest()

          def copy_native(source):
              requested = pathlib.Path(source)
              resolved = requested.resolve()
              target = native / requested.name
              if target.exists():
                  if digest(target) != digest(resolved):
                      raise RuntimeError(f"native-library basename collision: {requested.name}")
              else:
                  shutil.copy2(resolved, target)
              return requested, resolved

          def dependencies(binary):
              output = subprocess.check_output(("ldd", str(binary)), text=True, stderr=subprocess.STDOUT)
              for line in output.splitlines():
                  if "not found" in line:
                      raise RuntimeError(f"unresolved native dependency for {binary}: {line}")
                  match = re.search(r"=>\s+(/[^ ]+)", line) or re.match(r"\s*(/[^ ]+)\s+\(", line)
                  if match is not None:
                      candidate = pathlib.Path(match.group(1))
                      if candidate.is_file():
                          yield candidate

          # ldd is traversed to a fixed point for the interpreter, libpython,
          # and every copied lib-dynload extension.  Dependencies are queued in
          # sorted order so basename-collision detection is deterministic.
          queue = [interpreter, libpython.resolve()]
          queue.extend(sorted((root / "usr/lib/python3.12/lib-dynload").rglob("*.so")))
          seen = set()
          while queue:
              current = pathlib.Path(queue.pop(0)).resolve()
              if current in seen:
                  continue
              seen.add(current)
              if current == libpython.resolve():
                  copy_native(current)
              discovered = sorted(set(dependencies(current)))
              for dependency in discovered:
                  requested_dependency, resolved_dependency = copy_native(dependency)
                  # The interpreter's ELF loader must remain at its PT_INTERP
                  # absolute path; all ordinary libraries use the deterministic
                  # LD_LIBRARY_PATH directory above.
                  if requested_dependency.name.startswith("ld-linux"):
                      loader = root / requested_dependency.relative_to("/")
                      loader.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(resolved_dependency, loader)
                  if resolved_dependency not in seen:
                      queue.append(resolved_dependency)
          PY
          # CPython -S does not add site-packages.  The harness adds this one
          # pinned directory explicitly, so idna cannot leak from the host.
          uv pip install --require-hashes --only-binary :all: --target "$rootfs/opt/leitir/site-packages" -r requirements-contained-rootfs.lock
          install -m 0644 /dev/stdin "$rootfs/harness/runner.py" <<'PY'
          import builtins, importlib.util, json, os, pathlib, sys, unittest

          _NAMESPACE_NAMES = ("net", "user", "mnt", "pid", "ipc", "uts")

          def containment_attestation():
              parent_namespace_identities = tuple(
                  (name, os.environ["LEITIR_PARENT_NS_" + name.upper()]) for name in _NAMESPACE_NAMES
              )
              status = dict(line.split(":", 1) for line in pathlib.Path("/proc/self/status").read_text().splitlines() if ":" in line)
              namespace_mismatch = []
              for name, expected in parent_namespace_identities:
                  identity = pathlib.Path("/proc/self/ns", name).stat()
                  namespace_mismatch.append(f"{identity.st_dev}:{identity.st_ino}" != expected)
              return {"namespace_mismatch": all(namespace_mismatch), "no_new_privs": status.get("NoNewPrivs", "").strip() == "1", "pid_namespace_init": os.getpid() == 1, "schema_version": "leitir-contained-startup-attestation-v1", "seccomp_mode": int(status.get("Seccomp", "").strip())}

          def _rootfs_paths():
              rootfs = pathlib.Path(os.environ.get("LEITIR_ROOTFS", "/"))
              return rootfs, tuple(rootfs / path for path in ("work/staging-v1/src", "opt/leitir/site-packages", "usr/lib/python3.12/lib-dynload", "usr/lib/python3.12"))

          def verify_required_stdlib():
              rootfs, paths = _rootfs_paths()
              sys.path[:] = [str(path) for path in paths]
              for module_name in os.environ.get("LEITIR_REQUIRED_STDLIB", "").split():
                  sys.modules.pop(module_name, None)
                  module = __import__(module_name)
                  if module_name in sys.builtin_module_names:
                      continue
                  location = getattr(module, "__file__", None)
                  if not isinstance(location, str) or not pathlib.Path(location).resolve().is_relative_to(rootfs.resolve()):
                      raise RuntimeError(f"stdlib module did not resolve from scratch rootfs: {module_name}")

          def main():
              startup_attestation = containment_attestation()
              sys.stdout.buffer.write(json.dumps(startup_attestation, sort_keys=True, separators=(",", ":")).encode() + b"\n")
              sys.stdout.buffer.flush()
              # -S deliberately disables host site discovery.  In containment
              # the root is /; the scratch proof sets LEITIR_ROOTFS to exercise
              # these same image-owned paths without nsjail.
              rootfs, paths = _rootfs_paths()
              sys.path[:] = [str(path) for path in paths]
              # The scratch proof supplies every policy-authorized stdlib root
              # plus hashlib. Each must resolve from the copied image, never
              # the host.
              verify_required_stdlib()
              import hashlib
              observed = []
              original_import = builtins.__import__
              def recording_import(name, globals=None, locals=None, fromlist=(), level=0):
                  observed.append(name)
                  return original_import(name, globals, locals, fromlist, level)
              builtins.__import__ = recording_import
              outcomes = []
              for path in sorted((rootfs / "work/staging-v1/tests/rewritten").rglob("*.py")):
                  spec = importlib.util.spec_from_file_location("leitir_contract_" + hashlib.sha256(str(path).encode()).hexdigest(), path)
                  module = importlib.util.module_from_spec(spec)
                  try:
                      assert spec.loader is not None
                      spec.loader.exec_module(module)
                      names = sorted(name for name in vars(module) if name.startswith("test_"))
                  except BaseException:
                      names = []
                  for name in names:
                      test_id = path.name + "::" + name + "::-"
                      try:
                          getattr(module, name)(); outcome = "pass"
                      except unittest.SkipTest: outcome = "skip"
                      except BaseException: outcome = "fail"
                      outcomes.append({"canonical_test_id":test_id,"detail_category":"contained_runner_v1","detail_digest":"sha256:" + hashlib.sha256((test_id + outcome).encode()).hexdigest(),"outcome":outcome})
              builtins.__import__ = original_import
              frame = {"containment_attestation": startup_attestation, "donor_import_observed":any(name == "donor" or name.startswith("donor.") for name in observed),"outcomes":outcomes,"recorder_complete":True,"runtime_observation_digest":"sha256:" + hashlib.sha256(json.dumps(sorted(set(observed)), separators=(",", ":")).encode()).hexdigest(),"schema_version":"leitir-rerun-runner-frame-v1","teardown_complete":True}
              sys.stdout.buffer.write(json.dumps(frame, sort_keys=True, separators=(",", ":")).encode() + b"\n")

          if __name__ == "__main__":
              main()
          PY
          # The explicit -S path bootstrap must resolve every committed policy
          # authorization (and hashlib as a native-extension stress case) from
          # the image, rather than silently importing from the CI host.
          policy_stdlib="$(python3.12 - <<'PY'
          import json
          from pathlib import Path
          policy_paths = [*Path("benchmarks/exit-corpus/policies").glob("*.json"), *Path("benchmarks/bts-v1/tasks").glob("*/policy.json")]
          modules = sorted({module for path in policy_paths for module in json.loads(path.read_text(encoding="utf-8"))["stdlib_modules"]})
          required = {"random", "struct", "time", "zlib"}
          if not required <= set(modules):
              raise SystemExit("committed policy stdlib proof inputs are incomplete")
          print(" ".join((*modules, "hashlib")))
          PY
          )"
          LEITIR_ROOTFS="$rootfs" LEITIR_REQUIRED_STDLIB="$policy_stdlib" PYTHONHOME="$rootfs/usr" PYTHONPATH="$rootfs/work/staging-v1/src:$rootfs/opt/leitir/site-packages" LD_LIBRARY_PATH="$rootfs/usr/lib/leitir-native" "$rootfs/usr/bin/python3" -S -c 'import importlib.util; spec=importlib.util.spec_from_file_location("leitir_scratch_runner", "'"$rootfs"'/harness/runner.py"); runner=importlib.util.module_from_spec(spec); spec.loader.exec_module(runner); runner.verify_required_stdlib()'
          chmod -R a-w "$rootfs"
      - name: Build pinned nsjail
        run: sudo tools/build-nsjail.sh
      - name: Materialize every pinned exit-corpus donor
        env:
          PYTHONPATH: src
        run: |
          root="$RUNNER_TEMP/leitir-corpus-root"
          CORPUS_ROOT="$root" python - <<'PY'
          import os
          from pathlib import Path
          from leitir.exit_corpus import load_corpus_manifest
          from leitir.materialize import materialize_github_repo

          manifest = load_corpus_manifest(Path("benchmarks/exit-corpus/corpus-v1.1.json"))
          cases = manifest["cases"]
          assert isinstance(cases, list)
          for case in cases:
              assert isinstance(case, dict)
              donor = case["donor"]
              assert isinstance(donor, dict)
              host = donor["host"]
              owner = donor["owner"]
              repo = donor["repo"]
              commit = donor["commit_sha"]
              assert all(isinstance(value, str) for value in (host, owner, repo, commit))
              if host != "github.com":
                  raise RuntimeError(f"unsupported exit-corpus materialization host: {host}")
              materialize_github_repo(Path(os.environ["CORPUS_ROOT"]), f"github:{owner}/{repo}", owner, repo, commit)
          PY
      - name: Measure containment inputs
        id: substrate
        env:
          PYTHONPATH: src
        run: |
          rootfs="$RUNNER_TEMP/leitir-contained-rootfs"
          nsjail_commit="f78475530b46d0186111a9096b30725f816b55fe"
          nsjail_binary_sha="$(sha256sum /usr/bin/nsjail | cut -d' ' -f1)"
          printf 'nsjail_sha=sha256:%s\n' "$nsjail_binary_sha" >>"$GITHUB_OUTPUT"
          printf 'nsjail_version=nsjail@%s\n' "$nsjail_commit" >>"$GITHUB_OUTPUT"
          printf 'nsjail_build_identity=sha256:%s\n' "$(printf '%s%s' "$nsjail_commit" "$nsjail_binary_sha" | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          printf 'config_schema_digest=sha256:%s\n' "$(printf '%s' leitir-containment-policy-v1 | sha256sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          printf 'rootfs_digest=%s\n' "$(ROOTFS_SOURCE="$rootfs" python -c 'import os; from pathlib import Path; from leitir.exec_sandbox import _verified_directory_tree_digest; print(_verified_directory_tree_digest(Path(os.environ["ROOTFS_SOURCE"])))')" >>"$GITHUB_OUTPUT"
          printf 'python_version<<EOF\n%s\nEOF\n' "$(cat "$RUNNER_TEMP/leitir-python-version.txt")" >>"$GITHUB_OUTPUT"
      - name: Run exit gate
        id: exit_gate
