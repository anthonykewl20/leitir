          LEITIR_ENABLE_LIVE_E2E: '1'
          LEITIR_NSJAIL_DEBUG: '1'
          PYTHONPATH: src
        run: >-
          sudo --preserve-env=LEITIR_ENABLE_DONOR_EXECUTION,LEITIR_ENABLE_LIVE_E2E,LEITIR_NSJAIL_DEBUG,PYTHONPATH python tools/run_bts_tasks.py --root "$RUNNER_TEMP/leitir-bts-task-root" --out runs/bts-tasks
          --substrate-nsjail-sha ${{ steps.substrate.outputs.nsjail_sha }}
          --substrate-rootfs-digest ${{ steps.substrate.outputs.rootfs_digest }}
          --nsjail-version "${{ steps.substrate.outputs.nsjail_version }}"
          --nsjail-build-identity ${{ steps.substrate.outputs.nsjail_build_identity }}
