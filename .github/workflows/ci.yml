name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 0 * * MON'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    # Lane split (2026-09-04): PRs run the version extremes plus one leg per
    # platform (ubuntu 3.11/3.14, macos 3.13, windows 3.12); every main push
    # and the weekly schedule run the full seven-leg matrix, so the interior
    # minors (3.12, 3.12.3 floor pin, 3.13) are still gated on each merge.
    # Wall-time: serial legs measured ~14-15 min (2026-09-03); -n auto on the
    # 4-core public runners cuts that several-fold. Timeouts keep margin over
    # the sharded expectation plus straggler headroom for the subprocess-heavy
    # differential module (issue #199 discipline).
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.14'
          # Pinned interpreters (no floating '3.x'): macos 3.13 / windows 3.12
          # are both ≥ the ubuntu floor (3.11) and already exercised minors —
          # reproducible legs instead of runner-image drift (issue #199).
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.12'
          # Main-push/schedule-only interior minors; PRs rely on the 3.11
          # floor and 3.14 ceiling legs above plus the per-platform pins.
          - os: ubuntu-latest
            python-version: '3.12'
            if: ${{ github.event_name != 'pull_request' }}
          - os: ubuntu-latest
            python-version: '3.13'
            if: ${{ github.event_name != 'pull_request' }}
          # Patch-pinned 3.12 floor (audit 2026-08-23, P1(a)): 3.12.3-era
          # builds lazily import ntpath from pathlib and import machinery,
          # which the floating '3.12' leg never sees because setup-python
          # resolves the newest patch. The runtime import recorder must stay
          # correct on the oldest supported 3.12 patch, so pin it exactly.
          - os: ubuntu-latest
            python-version: '3.12.3'
            if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Run offline test suite
        shell: bash
        # -n auto: tests are process-isolated (tmp_path fixtures, subprocess
        # runners); xdist workers are separate processes, so in-test
        # thread-concurrency coverage (warm/safeio) is unaffected.
        run: PYTHONPATH=src uv run --no-project --with-requirements requirements.txt python -m pytest -q --tb=short -n auto

  determinism:
    # Widened from hash-seed-only to a bounded 3×2 cross: every seed runs
    # under both the explicit baseline env (TZ=UTC, LC_ALL=C.UTF-8) and a
    # shifted env (TZ=Asia/Kathmandu — a +05:45 offset — LC_ALL=C, which also
    # engages PEP 540 UTF-8 mode). Ordering-sensitive modules beyond the
    # original four: sbom (+ spdx/cyclonedx), apisurface (+ heuristic), diff,
    # index/builder, graph/registry, docpointers (issue #199). usage evidence
    # pipeline (issues #255-#259, PR #260): every stage emits canonical-JSON
    # digests and must replay byte-identically offline, so its whole test
    # surface belongs here. regex_budget (ReDoS bounds): catastrophic-shape
    # detection and match caps are pure/bounded and must classify identically
    # across seeds/locales.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hash-seed: ['0', '1', '42']
        env:
          - tz: UTC
            lc_all: C.UTF-8
          - tz: Asia/Kathmandu
            lc_all: C
    name: determinism (seed ${{ matrix.hash-seed }}, TZ ${{ matrix.env.tz }}, LC_ALL ${{ matrix.env.lc_all }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Test deterministic behavior with PYTHONHASHSEED=${{ matrix.hash-seed }} TZ=${{ matrix.env.tz }} LC_ALL=${{ matrix.env.lc_all }}
        env:
          PYTHONHASHSEED: ${{ matrix.hash-seed }}
          TZ: ${{ matrix.env.tz }}
          LC_ALL: ${{ matrix.env.lc_all }}
          PYTHONPATH: src
        run: >-
          uv run --no-project --with-requirements requirements.txt
          python -m pytest tests/test_treehash.py tests/test_materialize.py
          tests/test_parity.py tests/test_snapshot.py
          tests/test_sbom.py tests/test_sbom_spdx.py tests/test_sbom_cyclonedx.py
          tests/test_apisurface.py tests/test_apisurface_heuristic.py
          tests/test_diff.py tests/test_trigram_index.py
          tests/test_graph_polyglot.py tests/test_docpointers.py
          tests/test_usage_contract.py tests/test_usage_fixtures.py
          tests/test_usage_admission.py tests/test_usage_import_catalog.py
          tests/test_usage_resolver.py tests/test_usage_assemble.py
          tests/test_usage_cli.py tests/test_usage_replay.py
          tests/test_usage_portable_io.py tests/test_regex_budget.py -q

  tree-sitter-extra:
    # Observed ≤0:18; 15 min covers cold hash-locked wheel installs (issue #199).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements-tree-sitter.lock
      - name: Create isolated parser environment
        run: uv venv .tree-sitter-venv
      - name: Install hash-locked tree-sitter wheels
        run: >-
          uv pip install --python .tree-sitter-venv/bin/python
          --require-hashes --only-binary :all: -r requirements-tree-sitter.lock
      - name: Smoke-test certified runtime and grammar tuple
        run: |
          .tree-sitter-venv/bin/python - <<'PY'
          import tree_sitter_go as tsgo
          import tree_sitter_javascript as tsjavascript
          import tree_sitter_rust as tsrust
          import tree_sitter_typescript as tstypescript
          from tree_sitter import Language, Parser

          cases = (
              (tsjavascript.language, b"function value() {}"),
              (tstypescript.language_typescript, b"function value(): void {}"),
              (tsrust.language, b"fn value() {}"),
              (tsgo.language, b"package value\nfunc main() {}"),
          )
          for factory, source in cases:
              parser = Parser(Language(factory()))
              tree = parser.parse(source)
              assert not tree.root_node.has_error
          PY
      - name: Run polyglot graph scaffolding tests with the enabled extra
        run: |
          source .tree-sitter-venv/bin/activate
          PYTHONPATH=src uv run --active --no-project --with-requirements requirements.txt python -m pytest tests/test_graph_polyglot.py tests/test_graph_polyglot_typescript.py tests/test_graph_polyglot_rust.py tests/test_graph_polyglot_go.py -q

  coverage:
    # Observed 14:25 on main (2026-09-03; the 1:38 note was pre-suite-growth);
    # PR runs at 15:16 hit the old 15-min ceiling and were canceled. 30 min
    # ≈ 2× margin (issue #199 discipline, refreshed).
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Create isolated parser environment
        run: uv venv .tree-sitter-venv
      - name: Install hash-locked tree-sitter wheels
        run: >-
          uv pip install --python .tree-sitter-venv/bin/python
          --require-hashes --only-binary :all: -r requirements-tree-sitter.lock
      - name: Measure offline line and branch coverage
        env:
          PYTHONPATH: src
        run: |
          source .tree-sitter-venv/bin/activate
          uv run --active --no-project --with-requirements requirements.txt --with coverage==7.15.2 python -m coverage run --branch --source=leitir -m pytest -q -p no:cacheprovider
      - name: Write coverage reports
        run: |
          uv run --no-project --with coverage==7.15.2 python -m coverage report --precision=2 --fail-under=82.5
          uv run --no-project --with coverage==7.15.2 python -m coverage xml -o coverage.xml
          uv run --no-project --with coverage==7.15.2 python -m coverage json -o coverage.json
      - name: Enforce total and critical-module baselines
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          baseline = json.loads(
              Path(".github/workflows/coverage-baseline.json").read_text(encoding="utf-8")
          )
          report = json.loads(Path("coverage.json").read_text(encoding="utf-8"))
          failures = []
          total = report["totals"]["percent_covered"]
          total_minimum = baseline["combined_line_and_branch_percent"]["minimum"]
          if total < total_minimum:
              failures.append(f"total {total:.4f}% < {total_minimum:.4f}%")
          for module, minimum in sorted(baseline["modules"].items()):
              actual = report["files"][module]["summary"]["percent_covered"]
              if actual < minimum:
                  failures.append(f"{module} {actual:.4f}% < {minimum:.4f}%")
          if failures:
              raise SystemExit("coverage regression:\n" + "\n".join(failures))
          print(f"combined line+branch coverage: {total:.4f}%")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage.xml

  package:
    # Observed 0:21; 10 min ≥ 28× margin (issue #199).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      - name: Build wheel and source distribution
        run: uv run --no-project --with build --with twine python -m build --outdir dist/
      - name: Check distribution metadata
        run: uv run --no-project --with twine python -m twine check dist/*
      - name: List wheel contents
        run: python -c "import zipfile, sys; print('\n'.join(sorted(zipfile.ZipFile(sys.argv[1]).namelist())))" dist/*.whl
      - name: Check required wheel contents
        run: >-
          python -c "import glob, zipfile;
          required={'leitir/benchmarks/search-v1/manifest.json','leitir/benchmarks/corpus-v1/manifest.json','leitir/benchmarks/corpus-v1/README.md','leitir/__init__.py','leitir/cli.py','leitir/treehash.py'};
          names=set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist());
          missing=sorted(required-names);
          assert not missing, f'Missing required wheel entries: {missing}'"
      - name: Smoke-test installed wheel
        run: |
          python -m venv smoke-venv
          smoke-venv/bin/python -m pip install --no-deps dist/*.whl
          smoke-venv/bin/python -m leitir.cli --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-package-distributions
          path: dist/

  lint:
    # Observed 0:17; 15 min covers the full-surface mypy run cold (issue #199).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt
      # Ruff and mypy are now configured (pyproject [tool.ruff]/[tool.mypy])
      # and the tree is clean; enforce them to prevent regression.
      - name: Ruff
        run: uv run --no-project --with ruff ruff check .
      - name: Mypy
        # No path argument: honor pyproject [tool.mypy] files = src/leitir + tools
        # (score_engine excluded there), so tools/ — including sync_changelog.py,
        # executed two steps below — is type-checked by this gate (issue #199).
        run: uv run --no-project --with mypy --with-requirements requirements.txt python -m mypy
      - name: Changelog sync
        run: uv run --no-project --with-requirements requirements.txt python tools/sync_changelog.py --check
      - name: Docs truth
        # stdlib-only, imports no leitir code (parses src/leitir/cli.py as
        # text/AST); catches docs that reference a `leitir <verb>` command
        # that isn't a real registered subcommand (issue #266).
        run: python tools/check_docs_truth.py --check
      - name: Byte-compile source
        run: python -m compileall -q src
      - name: Smoke-import key modules
        env:
          PYTHONPATH: src
        run: python -c "import leitir; import leitir.cli; import leitir.treehash; import leitir.materialize; import leitir.resolver; import leitir.snapshot; import leitir.corpus; import leitir.trust"

  # Ed25519/auth signature-verification tests (ADR-0018): every offline leg
  # skips them because requirements.txt has no cryptography provider. This job
  # installs the separately reviewed, hash-locked provider and runs the two
  # gated files with zero skips allowed (issue #196).
  auth-tests:
    # Observed 0:16; 10 min ≥ 37× margin (issue #199).
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # The auth lock's reviewed transitive wheel closure (cffi single-hash
          # pin) fail-closes at installation on every other interpreter;
          # python 3.12 mirrors the bts-containment.yml install leg.
          python-version: '3.12'
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          cache-dependency-glob: requirements-auth.lock
      - name: Install test requirements
        # requirements.txt provides pytest; requirements-auth.lock provides the
        # Ed25519 verifier and MUST be installed with --require-hashes
        # --only-binary :all: per its header contract — a hash or platform
        # mismatch fails the install (fail-closed), never a source fallback.
        run: |
          uv pip install --system --requirement requirements.txt
          uv pip install --system --requirement requirements-auth.lock --require-hashes --only-binary :all:
      - name: Run auth-gated tests (cryptography skips forbidden)
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # 2>&1: capture stderr too — if pytest ever routed the skip summary
          # to stderr, a stdout-only tee would let skips past the guard (#196).
          python -m pytest -q -rs tests/test_manifest_auth.py tests/test_pipeline_cli.py 2>&1 | tee pytest-auth-tests.log
          ! grep -q '^SKIPPED' pytest-auth-tests.log

  # Configure "CI / required checks pass" as a required status check in branch
  # protection. Branch protection must be configured separately in GitHub settings.
  required-checks-pass:
    name: required checks pass
    if: always()
    needs:
      - test
      - determinism
      - tree-sitter-extra
      - coverage
      - package
      - lint
      - auth-tests
    # Aggregate gate only; observed 0:03 (issue #199).
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # v1.2.4 does not exist upstream; v1.2.2 is the latest published tag.
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
