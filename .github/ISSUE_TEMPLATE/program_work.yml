name: Program work (BTS / milestone-tracked feature)
description: Scoped, gated engineering work tracked by a milestone, with explicit acceptance and non-goals.
title: ""
labels: ["enhancement"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Declarative statement of the current defect or missing capability, with the consequence in parentheses. Match house title style.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Real-world acceptance criteria
      description: Checkbox list of observable, user-facing criteria ("when a user runs X, they observe Y"). Do NOT pre-commit to test counts or pass/skip numbers — the live count belongs in the PR and README's dated status paragraph, not the issue.
    validations:
      required: true
  - type: textarea
    id: nongoals
    attributes:
      label: Non-goals
      description: Explicit boundary of what this issue does NOT do.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Files with line ranges, prior art with pinned revisions, and ADR links.
    validations:
      required: true
